name: Rust CI

on:
  push:
    branches:
      - main
      - 'gaebal/**'
      - 'omx-issue-*'
    paths:
      - .github/workflows/rust-ci.yml
      - rust/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rust-ci.yml
      - rust/**
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run workspace tests
        run: |
          # Timed bash commands need a cgroup v2 they can create children in.
          # GitHub-hosted runners do not delegate the job cgroup, and they
          # block unprivileged user namespaces, so the pid-namespace fallback
          # cannot start either. Root moves this step into a memory domain;
          # the supervisor then creates its own child cgroup underneath.
          base=/sys/fs/cgroup/claw-delegate
          sudo mkdir -p "$base"
          if ! grep -qw memory "$base/cgroup.subtree_control"; then
            echo '+memory' | sudo tee "$base/cgroup.subtree_control" >/dev/null
          fi
          sudo mkdir -p "$base/job"
          sudo chown "$(id -u):$(id -g)" "$base/job"
          echo $$ | sudo tee "$base/job/cgroup.procs" >/dev/null
          echo "bash containment cgroup: $(cat /proc/self/cgroup)"
          cargo test --workspace
